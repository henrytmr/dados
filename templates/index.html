<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Siló · Dados VIP</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d9cfc0;
  touch-action: none;
  font-family: 'Georgia', 'Times New Roman', serif;
}

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}

canvas { display: block; width: 100%; height: 100%; }

#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(60, 40, 20, 0.35) 100%);
}

/* ============================================================
   BARRA DE AGITACIÓN — AHORA EN LA PARTE INFERIOR
   ============================================================ */
#barra-revolucion {
  position: fixed;
  bottom: 130px;                        /* ⚡ abajo, no en el centro */
  left: 50%;
  transform: translateX(-50%) scale(0.92);
  z-index: 15;
  width: 92vw;
  max-width: 900px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
}
#barra-revolucion.visible {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

#alerta-soltar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 14px;
  padding: 12px 24px;
  border-radius: 40px;
  background: rgba(40, 5, 0, 0.35);
  border: 2px solid rgba(120, 30, 20, 0.35);
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}

#alerta-soltar .punto {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #6b2020;
  box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
  transition: all 0.3s ease;
  flex-shrink: 0;
}

#alerta-soltar .texto {
  font-size: clamp(1rem, 2.6vw, 1.6rem);
  letter-spacing: 10px;
  font-weight: 900;
  text-transform: uppercase;
  color: rgba(160, 60, 40, 0.5);
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

#alerta-soltar.activo {
  background: rgba(120, 15, 0, 0.75);
  border-color: rgba(255, 80, 50, 0.95);
  box-shadow: 0 0 35px rgba(255, 60, 40, 0.85),
              0 0 80px rgba(255, 60, 40, 0.5),
              inset 0 0 30px rgba(255, 100, 60, 0.35);
}

#alerta-soltar.activo .punto {
  background: radial-gradient(circle at 35% 30%, #ff7050, #d01400 55%, #700000);
  box-shadow: 0 0 30px rgba(255, 80, 50, 1),
              0 0 60px rgba(255, 80, 50, 0.8),
              inset 0 -3px 6px rgba(0,0,0,0.5);
  animation: pulseAlerta 0.55s infinite alternate;
}

#alerta-soltar.activo .texto {
  color: #ff6040;
  text-shadow: 0 0 22px rgba(255, 90, 60, 1),
               0 0 45px rgba(255, 60, 40, 0.9),
               0 2px 6px rgba(0,0,0,0.7);
}

@keyframes pulseAlerta {
  from { transform: scale(1); }
  to { transform: scale(1.45); }
}

.barra-track {
  position: relative;
  height: clamp(46px, 7vh, 68px);
  border-radius: 42px;
  background: rgba(60, 40, 15, 0.22);
  box-shadow: inset 0 4px 14px rgba(50, 30, 10, 0.45),
              inset 0 -3px 8px rgba(255, 255, 255, 0.4),
              0 3px 0 rgba(255, 255, 255, 0.55),
              0 10px 28px rgba(60, 40, 15, 0.3);
  overflow: hidden;
  border: 2.5px solid rgba(120, 85, 35, 0.55);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.barra-track.alerta {
  border-color: rgba(220, 40, 25, 0.9);
  box-shadow: inset 0 4px 14px rgba(50, 30, 10, 0.45),
              0 0 40px rgba(255, 60, 40, 0.7),
              0 0 80px rgba(255, 60, 40, 0.35),
              0 10px 28px rgba(60, 40, 15, 0.3);
}

.barra-fill {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 0%;
  border-radius: 42px;
  background: linear-gradient(90deg, #b08640 0%, #d4a850 30%, #e8c470 60%, #f0d890 100%);
  box-shadow: 0 0 45px rgba(212, 168, 80, 0.95),
              0 0 90px rgba(212, 168, 80, 0.55),
              inset 0 3px 0 rgba(255, 255, 255, 0.8),
              inset 0 -3px 8px rgba(120, 80, 20, 0.5);
  transition: width 0.06s linear;
}

.barra-fill::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 200px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
  animation: shineBar 1.6s infinite;
  border-radius: 42px;
}

@keyframes shineBar {
  0% { left: -200px; }
  100% { left: 100%; }
}

.barra-porcentaje {
  text-align: center;
  margin-top: 10px;
  font-size: clamp(1rem, 2.8vw, 1.6rem);
  letter-spacing: 12px;
  color: rgba(60, 38, 10, 0.9);
  font-weight: 900;
  text-shadow: 0 2px 5px rgba(255, 255, 255, 0.75);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   BOTÓN DE ACCIÓN — ABAJO DEL TODO
   ============================================================ */
#btn-accion {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translate(-50%, 30px);
  z-index: 25;
  padding: 16px 44px;
  border-radius: 60px;
  border: 1.5px solid rgba(180, 140, 60, 0.75);
  background: linear-gradient(180deg, rgba(255, 245, 215, 0.98) 0%,
              rgba(230, 200, 145, 0.98) 50%,
              rgba(200, 160, 90, 0.98) 100%);
  backdrop-filter: blur(14px);
  color: #3a2408;
  font-family: 'Georgia', serif;
  font-size: clamp(0.85rem, 2vw, 1.05rem);
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
  box-shadow: 0 8px 28px rgba(90, 60, 20, 0.4),
              0 0 35px rgba(255, 220, 140, 0.55),
              inset 0 1px 0 rgba(255, 255, 255, 0.9),
              inset 0 -2px 6px rgba(120, 80, 20, 0.3);
  text-shadow: 0 1px 0 rgba(255, 240, 200, 0.8);
  display: flex;
  align-items: center;
  gap: 14px;
}

#btn-accion.visible {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}

#btn-accion:active {
  transform: translate(-50%, 4px) scale(0.97);
}

#btn-accion .icono {
  font-size: 1.4em;
  filter: drop-shadow(0 2px 2px rgba(90, 60, 20, 0.5));
}

/* ============================================================
   HINT INICIAL
   ============================================================ */
#hint-inicial {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  color: rgba(90, 60, 30, 0.8);
  font-size: clamp(0.7rem, 1.7vw, 0.85rem);
  letter-spacing: 4px;
  text-transform: uppercase;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
  opacity: 1;
  transition: opacity 0.8s ease;
  pointer-events: none;
}

#hint-inicial.oculto { opacity: 0; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>

<div id="canvas-container"></div>
<div id="vignette"></div>

<div id="hint-inicial">Agita el dispositivo para lanzar</div>

<div id="barra-revolucion">
  <div id="alerta-soltar">
    <span class="punto"></span>
    <span class="texto">SUELTA</span>
  </div>
  <div class="barra-track" id="barra-track">
    <div class="barra-fill" id="barra-fill"></div>
  </div>
  <div class="barra-porcentaje" id="barra-porcentaje">0%</div>
</div>

<button id="btn-accion">
  <span class="icono">🎲</span>
  <span id="btn-accion-texto">Tirar Dados</span>
</button>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
